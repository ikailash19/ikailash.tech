<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kailash | Portfolio</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, var(--accent-glow), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.12), transparent 40%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .container {
      max-width: 620px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeUp 0.7s ease-out;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 2rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2.25rem;
    }

    .skill-tag {
      font-size: 0.85rem;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 0.35rem 0.8rem;
      border-radius: 8px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 1.4rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0b0f19;
    }

    .btn-primary:hover {
      background-color: #7dd3fc;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container { padding: 2rem 1.5rem; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">
      <span class="dot"></span>
      Building in public
    </div>

    <h1>Hi, I'm Kailash.</h1>

    <p>
      Welcome to my corner of the web. I'm currently crafting my full portfolio and showcasing new projects—check back soon or connect with me below.
    </p>

    <div class="skills">
      <span class="skill-tag">Software Development</span>
      <span class="skill-tag">Web Technologies</span>
      <span class="skill-tag">Problem Solving</span>
    </div>

    <div class="actions">
      <a href="https://github.com/ikailash19/" target="_blank" rel="noopener" class="btn btn-primary">
        GitHub Profile
      </a>
      <a href="mailto:kailashiviswanathan@gmail.com" class="btn btn-secondary">
        Get in Touch
      </a>
    </div>
  </main>
</body>
</html>
